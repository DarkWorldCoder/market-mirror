  <path d="M946.5,502 v6" stroke="#8C897E" />
  <text x="946.5" y="532" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5A5A54" font-weight="400" text-anchor="middle">75%</text>
  <path d="M1144.0,502 v6" stroke="#8C897E" />
  <text x="1144.0" y="532" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5A5A54" font-weight="400" text-anchor="middle">100%</text>
  <text x="44" y="574" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5A5A54" font-weight="400" text-anchor="start">Gemini-written buyers were answered by Claude after provider quota limits.</text>
  <text x="44" y="605" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5A5A54" font-weight="400" text-anchor="start">AI-generated intentions in this run; not observed customer conversion rates.</text>
