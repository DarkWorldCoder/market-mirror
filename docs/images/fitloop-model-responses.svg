  <text x="354" y="387" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5A5A54" font-weight="400" text-anchor="start">Yes 0.9%   ·   Maybe 69.7%   ·   No 29.4%</text>
  <text x="44" y="444" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#202020" font-weight="700" text-anchor="start">Codex-written buyers</text>
