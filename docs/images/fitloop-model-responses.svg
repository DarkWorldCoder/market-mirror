  <text x="354.0" y="532" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5A5A54" font-weight="400" text-anchor="middle">0%</text>
  <path d="M551.5,502 v6" stroke="#8C897E" />
  <text x="551.5" y="532" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5A5A54" font-weight="400" text-anchor="middle">25%</text>
  <path d="M749.0,502 v6" stroke="#8C897E" />
