<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Simulated trial-start responses differ between model groups</title>
  <desc id="desc">Claude-written buyers answered by Claude: yes 1.3%, maybe 75.6%, no 23.1%. Gemini-written buyers answered by Claude as a stand-in: yes 0.9%, maybe 69.7%, no 29.4%. Codex-written buyers answered by Codex: yes 0%, maybe 5.7%, no 94.3%. These are generated responses, not real conversion rates.</desc>
  <rect width="1200" height="630" rx="20" fill="#FAF9F6" />
  <text x="44" y="47" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6E5B16" font-weight="400" text-anchor="start">DOCUMENTED FITLOOP EXAMPLE · SIMULATED RESPONSES</text>
  <text x="44" y="91" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#202020" font-weight="700" text-anchor="start">The same offer, different AI responses</text>
  <text x="44" y="127" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5A5A54" font-weight="400" text-anchor="start">Would start the trial: yes, maybe, or no. Groups are based on who wrote each buyer.</text>
  <rect x="44" y="153" width="18" height="18" rx="3" fill="#E8C548" />
  <text x="72" y="169" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#202020" font-weight="400" text-anchor="start">Yes</text>
  <rect x="170" y="153" width="18" height="18" rx="3" fill="#CFCBC0" />
  <text x="198" y="169" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#202020" font-weight="400" text-anchor="start">Maybe</text>
  <rect x="325" y="153" width="18" height="18" rx="3" fill="#343434" />
  <text x="353" y="169" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#202020" font-weight="400" text-anchor="start">No</text>
  <text x="44" y="238" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#202020" font-weight="700" text-anchor="start">Claude-written buyers</text>
  <text x="44" y="262" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5A5A54" font-weight="400" text-anchor="start">1,000 buyers</text>
  <text x="44" y="285" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5A5A54" font-weight="400" text-anchor="start">Answers: Claude</text>
  <rect x="354.000" y="220" width="10.270" height="37" fill="#E8C548" />
  <rect x="364.270" y="220" width="597.240" height="37" fill="#CFCBC0" />
  <text x="662.8899999999999" y="245" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#202020" font-weight="700" text-anchor="middle">Maybe 75.6%</text>
  <rect x="961.510" y="220" width="182.490" height="37" fill="#343434" />
  <text x="1052.7549999999999" y="245" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="middle">No 23.1%</text>
  <text x="354" y="284" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5A5A54" font-weight="400" text-anchor="start">Yes 1.3%   ·   Maybe 75.6%   ·   No 23.1%</text>
  <text x="44" y="341" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#202020" font-weight="700" text-anchor="start">Gemini-written buyers</text>
  <text x="44" y="365" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5A5A54" font-weight="400" text-anchor="start">1,000 buyers</text>
  <text x="44" y="388" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5A5A54" font-weight="400" text-anchor="start">Answers: Claude stand-in</text>
  <rect x="354.000" y="323" width="7.110" height="37" fill="#E8C548" />
  <rect x="361.110" y="323" width="550.630" height="37" fill="#CFCBC0" />
  <text x="636.425" y="348" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#202020" font-weight="700" text-anchor="middle">Maybe 69.7%</text>
