ll="#22221f" stroke="#2b2b28"/><circle cx="76" cy="348" r="13" fill="#f3d64b" class="a13"/><circle cx="116" cy="348" r="13" fill="#22221f" stroke="#2b2b28"/><circle cx="116" cy="348" r="13" fill="#f3d64b" class="a14"/><circle cx="156" cy="348" r="13" fill="#22221f" stroke="#2b2b28"/><circle cx="156" cy="348" r="13" fill="#7bd88f" class="a15"/><circle cx="196" cy="348" r="13" fill="#22221f" stroke="#2b2b28"/><circle cx="196" cy="348" r="13" fill="#f3d64b" class="a16"/><circle cx="236" cy="348" r="13" fill="#22221f" stroke="#2b2b28"/><circle cx="236" cy="348" r="13" fill="#ef7b6b" class="a17"/><text x="40" y="384" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#f4f1ea" font-weight="600" text-anchor="start">Five analysts read the run on their own:</text><text x="40" y="401" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#a9a89f" font-weight="400" text-anchor="start">a check on the report, not a vote.</text><rect x="900" y="120" width="260" height="220" rx="14" fill="#171715" stroke="#2b2b28"/><text x="920" y="148" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11" fill="#a9a89f" font-weight="600" text-anchor="start">DECISION CARD</text><g class="a18"><g transform="rotate(-4 1030 200)"><rect x="950" y="176" width="160" height="46" rx="8" fill="none" stroke="#f3d64b" stroke-width="3"/><text x="1030" y="208" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#f3d64b" font-weight="800" text-anchor="middle">ITERATE</text></g></g><g class="a19"><text x="920" y="256" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#f4f1ea" font-weight="600" text-anchor="start">Change the weak parts</text><text x="920" y="276" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#f4f1ea" font-weight="600" text-anchor="start">and test again.</text><text x="920" y="314" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#a9a89f" font-weight="400" text-anchor="start">A go does not guarantee sales.</text></g><text x="1160" y="404" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11" fill="#a9a89f" font-weight="400" text-anchor="end">Thresholds from the README: go needs a mean of 3.75, iterate 3.1.</text></svg>
