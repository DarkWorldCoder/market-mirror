ight="24" rx="12" fill="none" stroke="#f3d64b"/><text x="1088.35" y="46" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11" fill="#f3d64b" font-weight="600" text-anchor="middle">Linux, macOS or WSL</text><rect x="40" y="84" width="720" height="300" rx="12" fill="#121211" stroke="#2b2b28"/><path d="M40 114 H760" stroke="#2b2b28"/><circle cx="60" cy="99" r="5" fill="#ef7b6b"/><circle cx="76" cy="99" r="5" fill="#f3d64b"/><circle cx="92" cy="99" r="5" fill="#7bd88f"/><text x="400.0" y="103" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11" fill="#a9a89f" font-weight="600" text-anchor="middle">market-mirror</text><clipPath id="t0"><rect x="58" y="128" width="628" height="20" class="a1"/></clipPath><g clip-path="url(#t0)" class="a2"><text x="60" y="142" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" fill="#f4f1ea" font-weight="500" text-anchor="start"><tspan fill="#f3d64b">$</tspan> git clone https://github.com/DarkWorldCoder/market-mirror.git &amp;&amp; cd market-mirror</text></g><clipPath id="t1"><rect x="58" y="158" width="224" height="20" class="a3"/></clipPath><g clip-path="url(#t1)" class="a4"><text x="60" y="172" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" fill="#f4f1ea" font-weight="500" text-anchor="start"><tspan fill="#f3d64b">$</tspan> bash install.sh --configure</text></g><g class="a5"><text x="60" y="202" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" fill="#a9a89f" font-weight="400" text-anchor="start"># installs the engine, then asks which model provider to use</text></g><clipPath id="t3"><rect x="58" y="218" width="426" height="20" class="a6"/></clipPath><g clip-path="url(#t3)" class="a7"><text x="60" y="232" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" fill="#f4f1ea" font-weight="500" text-anchor="start"><tspan fill="#f3d64b">$</tspan> ./mm start &amp;&amp; ./mm cli quickstart --out scenarios/acme</text></g><g class="a8"><text x="60" y="262" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" fill="#a9a89f" font-weight="400" text-anchor="start"># 9 questions; prepares a small simulated market, then stops for review</text></g><g class="a9"><text x="60" y="304" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" fill="#a9a89f" font-weight="400" text-anchor="start"># already in Claude Code, Codex, Gemini CLI or Cursor?</text></g><clipPath id="t6"><rect x="58" y="320" width="381" height="20" class="a10"/></clipPath><g clip-path="url(#t6)" class="a11"><text x="60" y="334" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" fill="#f4f1ea" font-weight="500" text-anchor="start"><tspan fill="#f3d64b">$</tspan> claude mcp add market-mirror -- uvx marketmirror</text></g><g class="a12"><text x="60" y="364" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" fill="#a9a89f" font-weight="400" text-anchor="start"># then ask your agent to run doctor and setup</text></g><g class="a13"><rect x="790" y="84" width="370" height="300" rx="12" fill="#171715" stroke="#f3d64b"/><path d="M790 114 H1160" stroke="#2b2b28"/><text x="806" y="103" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11" fill="#a9a89f" font-weight="600" text-anchor="start">dashboard.html · opens offline</text><text x="810" y="146" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11" fill="#a9a89f" font-weight="600" text-anchor="start">Decision</text><rect x="810" y="154" width="110" height="28" rx="6" fill="none" stroke="#f3d64b" stroke-width="2"/><text x="865" y="173" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill