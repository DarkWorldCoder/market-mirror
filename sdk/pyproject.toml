[project]
name = "marketmirror"
version = "0.3.0"
description = "Python client for MarketMirror: marketing and sales simulation on simulated buyers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0" }
dependencies = ["requests>=2.28"]

[project.urls]
Homepage = "https://github.com/DarkWorldCoder/market-mirror"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["marketmirror*"]
